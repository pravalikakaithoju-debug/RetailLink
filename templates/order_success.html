<!DOCTYPE html>
<html>
<head>

    <title>Order Success</title>

    <style>

        body{

            margin:0;
            font-family:Arial;
            background:#f4f8ff;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

        }

        .card{

            background:white;
            padding:50px;
            border-radius:20px;

            text-align:center;

            box-shadow:0 4px 15px rgba(0,0,0,.1);

            width:450px;

        }

        h1{

            color:green;
            margin-bottom:20px;

        }

        p{

            font-size:20px;
            line-height:1.8;

        }

        a{

            display:inline-block;

            margin-top:25px;

            background:#0d6efd;

            color:white;

            text-decoration:none;

            padding:12px 22px;

            border-radius:10px;

        }

    </style>

</head>

<body>

    <div class="card">

        <h1>
            Order Placed Successfully
        </h1>

        <p>

            Your Order ID:
            <strong>
                {{ order.id }}
            </strong>

            <br><br>

            Total Amount:
            <strong>
                ₹{{ order.total_amount }}
            </strong>

        </p>

        <a href="/my-orders/">

            View My Orders

        </a>

    </div>

</body>
</html>

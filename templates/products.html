<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f8ff;
        }

        nav{
            background:#0d6efd;
            color:white;
            padding:18px 35px;

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-size:17px;
        }

        .container{
            width:90%;
            margin:auto;
            padding:40px 0;
        }

        h1{
            color:#0d6efd;
            margin-bottom:30px;
        }

        .products{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:30px;
        }

        .card{
            background:white;
            border-radius:15px;
            padding:20px;
            box-shadow:0 4px 15px rgba(0,0,0,.08);
            text-align:center;
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:10px;
        }

        .card h2{
            color:#0d6efd;
            margin-top:15px;
        }

        .price{
            font-size:20px;
            font-weight:bold;
            margin:10px 0;
        }

        input{
            width:60px;
            padding:8px;
            text-align:center;
        }

        button{
            background:#0d6efd;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            cursor:pointer;
            margin-top:15px;
        }

    </style>

</head>

<body>

<nav>

    <div>
        RetailLink
    </div>

    <div>

        <a href="/products/">
            Products
        </a>

        <a href="/cart/">
            Cart
        </a>

        <a href="/my-orders/">
            My Orders
        </a>

        <a href="/logout/">
            Logout
        </a>

    </div>

</nav>

<div class="container">

    <h1>Products</h1>

    <div class="products">

        {% for product in products %}

        <div class="card">

            <img src="{{ product.image.url }}">

            <h2>
                {{ product.name }}
            </h2>

            <p>
                {{ product.description }}
            </p>

            <div class="price">
                ₹{{ product.price }}
            </div>

            <form action="/add-to-cart/" method="GET">

                <input type="hidden"
                       name="id"
                       value="{{ product.id }}">

                <input type="number"
                       name="qty"
                       value="1"
                       min="1">

                <br>

                <button type="submit">
                    Add to Cart
                </button>

            </form>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Register - RetailLink</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f4f8ff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            width:350px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            color:#0d6efd;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            color:#0d6efd;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Retailer Register</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Register
        </button>
    </form>

    <p>
        Already have account?
        <a href="/login/">Login</a>
    </p>

</div>

</body>
</html>
